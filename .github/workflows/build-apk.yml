name: Build Android APK

on:
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Copy website files into the app
        run: npm run build:web

      - name: Create the Android project
        run: npx cap add android

      - name: Add app icons and notification permissions
        run: node scripts/prepare-android.js

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: Hanuman-Disha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
